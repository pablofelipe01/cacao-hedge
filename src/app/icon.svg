<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="CacaoHedge">
  <title>CacaoHedge</title>
  <!--
    Una mazorca de cacao sobre fondo de marca.

    El favicon se ve casi siempre a 16 px, así que la silueta manda sobre
    el detalle: la forma de la mazorca se reconoce a ese tamaño y los
    surcos se funden en textura sin dejar suciedad. Lleva fondo propio
    porque la pestaña puede ser clara u oscura, y una silueta suelta
    desaparecería en una de las dos.

    Tres surcos longitudinales, no dos simétricos: dos que se juntan en
    las puntas dibujan una lente en el centro y la mazorca pasa a leerse
    como una hoja.

    Colores tomados de la paleta de globals.css. Verde y rojo quedan fuera
    a propósito: en esta aplicación significan ganancia y pérdida.
  -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d4527" />
      <stop offset="1" stop-color="#33200f" />
    </linearGradient>
    <linearGradient id="mazorca" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#f4d191" />
      <stop offset="0.5" stop-color="#e0ac3c" />
      <stop offset="1" stop-color="#bd8418" />
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="url(#fondo)" />

  <g transform="rotate(-20 16 16)">
    <path
      d="M16 5.2C21.3 8.2 22.3 12.3 22.3 16s-1 7.8-6.3 10.8C10.7 23.8 9.7 19.7 9.7 16S10.7 8.2 16 5.2z"
      fill="url(#mazorca)"
    />
    <g fill="none" stroke="#8a5a26" stroke-width="0.75" stroke-linecap="round" opacity="0.3">
      <path d="M14.2 8.3c-1.6 3.9-1.6 11.1 0 15.4" />
      <path d="M16 7.3c-0.55 4.6-0.55 12.8 0 17.4" />
      <path d="M17.8 8.3c1.6 3.9 1.6 11.1 0 15.4" />
    </g>
  </g>
</svg>
